name: Collect UX news

on:
  schedule:
    # 08:30 UTC = 17:30 JST 毎日(アプリの平日18:30自動表示より前に用意する)
    - cron: '30 8 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: collect-news
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Collect feed
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4o
        run: node collect.mjs

      - name: Commit feed
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/feed.json state/seen.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Update news feed ($(date -u +%Y-%m-%d))"
          BRANCH="${GITHUB_REF_NAME:-main}"
          # リモートが進んでいても取り込んでから push する(再実行や競合に強くする)
          for i in 1 2 3; do
            if git pull --rebase --autostash origin "$BRANCH" && git push origin "HEAD:$BRANCH"; then
              echo "pushed."
              exit 0
            fi
            echo "push retry $i ..."
            sleep 5
          done
          echo "push failed after retries"; exit 1
